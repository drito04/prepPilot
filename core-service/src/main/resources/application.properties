server.port= 8080

spring.application.name= core-service
spring.datasource.url= ${DB_URL}
spring.datasource.username= ${DB_USER}
spring.datasource.password= ${DB_PASSWORD}

spring.jpa.open-in-view= false
spring.jpa.hibernate.ddl-auto= validate

spring.flyway.enabled= true
spring.flyway.locations= classpath:db/migration

app.jwt.secret= ${JWT_SECRET}
app.jwt.expiry-seconds= ${JWT_EXPIRY_SECONDS:7200}
app.cors.frontend-origin= ${FRONTEND_ORIGIN:http://localhost:5173}

app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.interviewer-email=${SEED_INTERVIEWER_EMAIL:}
app.seed.interviewer-password=${SEED_INTERVIEWER_PASSWORD:}\
  
# Mail (Mailpit in dev)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App mail and OTP settings
app.mail.from=${MAIL_FROM:no-reply@preppilot.local}
app.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
app.otp.max-sends-per-hour=5