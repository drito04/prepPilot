# Docker's internal DNS. Nginx re-resolves service names every 10 s, so restarting
# core or realtime never leaves the gateway pointing at an old container address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Upgrade only when the client asks for it (needed for WebSockets).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    # If a service is down, answer in JSON like every other error in this project.
    error_page 502 503 504 = @upstream_down;

    # REST API -> core. The path is NOT stripped: /api/auth/login stays /api/auth/login.
    location /api/ {
        set $core http://core-service:8080;
        proxy_pass $core;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO -> realtime. WebSocket upgrade headers are required.
    location /socket.io/ {
        set $realtime http://realtime-service:4000;
        proxy_pass $realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Placeholder until the React app is added in the frontend sessions.
    location = / {
        default_type text/plain;
        return 200 "prepPilot gateway is up. The web app arrives in the frontend sessions.\n";
    }

    # Everything else, including /ml/ and /actuator/, is simply not routed.
    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"NOT_FOUND","message":"Not Found"}';
    }

    location @upstream_down {
        default_type application/json;
        return 502 '{"status":502,"error":"BAD_GATEWAY","message":"Service temporarily unavailable"}';
    }
}