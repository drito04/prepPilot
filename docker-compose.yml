services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  core-service:
    build: ./core-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/yourdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS:-7200}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-} # new
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-} # new
      SEED_INTERVIEWER_EMAIL: ${SEED_INTERVIEWER_EMAIL:-} # new
      SEED_INTERVIEWER_PASSWORD: ${SEED_INTERVIEWER_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@preppilot.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  realtime-service:
    build: ./realtime-service
    environment:
      FRONTEND_ORIGIN: http://localhost
    ports:
      - "4000:4000"
    depends_on:
      - redis

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://core-service:8080
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - core-service

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - core-service
      - realtime-service
      - frontend

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP, where the app sends mail
      - "8025:8025" # web inbox and API

volumes:
  pgdata:
