name: core-ci

on:
  pull_request:
    paths:
      - "core-service/**"
      - ".github/workflows/core-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "core-service/**"
      - ".github/workflows/core-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: preppilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d preppilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      TEST_DB_URL: jdbc:postgresql://localhost:5432/preppilot_test

    defaults:
      run:
        working-directory: core-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B -ntp test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: core-service/target/surefire-reports
