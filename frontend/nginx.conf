server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build files never change, so browsers can keep them.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache index.html, so a new deploy is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: any other path serves index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}